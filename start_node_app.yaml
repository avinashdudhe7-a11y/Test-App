services:
  mongo:
    image: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty
  node_app:
    build:
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://admin:qwerty@mongo:27017
      SAMUDRA_NAME: samuda_name
    ports:
      - 8000:8000
