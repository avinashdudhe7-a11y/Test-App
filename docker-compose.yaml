services:
  # 1. The Database
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"

  # 2. The Database UI (Mongo Express)
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017/
    depends_on:
      - mongodb

  # 3. Your Node.js App
  app:
    build: .
    container_name: node-app
    ports:
      - "5050:5050" # Map Laptop Port : Container Port
    environment:
      - MONGO_URL=mongodb://admin:password@mongodb:27017/mydb?authSource=admin
    depends_on:
      - mongodb
